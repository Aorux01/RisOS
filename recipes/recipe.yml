# RisOS 0.00.00: Kinoite image (Fedora Atomic, KDE Plasma) built with BlueBuild.
# Module reference: https://blue-build.org/reference/recipe/
name: risos
description: RisOS, an atomic OS derived from Fedora Kinoite.

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  # Copy files/system/ to the image root (wallpapers, color schemes, ...).
  - type: files
    files:
      - source: system
        destination: /

  # System packages. Keep it minimal: everything else goes through Flatpak.
  - type: dnf
    install:
      packages:
        - fastfetch
        - distrobox
        - podman
        - plymouth-plugin-script
        - librsvg2-tools

  # Identity (os-release), Figtree font, boot/update splash (Plymouth).
  - type: script
    scripts:
      - identity.sh
      - fonts.sh
      - plymouth.sh

  # Rebuild the initramfs so the Plymouth theme is available at boot.
  - type: initramfs

  # User apps (Flatpak). The RisOS Store comes later.
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - org.mozilla.firefox

  # Image signing (cosign.pub at the repo root).
  - type: signing
